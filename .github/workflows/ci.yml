name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch: {}   # permite disparo MANUAL (usado pelo job de deploy)

jobs:
  # Job 1: Testes do Backend (Go)
  backend-tests:
    name: Backend Tests (Go)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: appdb_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: backend
        run: go mod download

      # informativo: o código nunca passou no golangci-lint; não trava o pipeline (go vet + testes travam)
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        continue-on-error: true
        with:
          version: latest
          working-directory: backend

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Run tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: appdb_test
          DB_USER: app
          DB_PASSWORD: app
          JWT_SECRET: test-secret-key-for-ci-only
          LOG_FORMAT: json
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.out
          flags: backend

  # Job 2: Testes do Frontend (React)
  frontend-tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # Job 3: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      # repositório privado: a aba Security só recebe o relatório com GitHub Advanced Security
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum

      # informativo: excelize v2.10.0 tem CVEs corrigidas só em commits sem versão publicada
      - name: Run govulncheck (Go CVE scanner)
        working-directory: backend
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  # Job 4: Docker Build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # backend/ocr_prod (pipeline de extração) fica fora do git e só existe na VPS; no CI basta um vazio para o build
      - name: Stub ocr_prod
        run: mkdir -p backend/ocr_prod && touch backend/ocr_prod/requirements.txt

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ressarcimento-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ressarcimento-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ressarcimento-backend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

  # ============================================================================
  # Job 5: Deploy na VPS  (MANUAL — só via "Actions > Run workflow"; NÃO roda em push/PR)
  # ----------------------------------------------------------------------------
  # Secrets do ambiente "production" (Settings > Environments > production):
  #   VPS_HOST        -> IP/host da VPS (ex.: 179.127.26.37)
  #   VPS_USER        -> usuário SSH
  #   VPS_SSH_KEY     -> chave privada SSH (conteúdo)
  #   VPS_APP_DIR     -> caminho do projeto na VPS (ex.: /opt/ressarcimento_system)
  #   ENV_FILE        -> conteúdo inteiro do backend/.env (opcional: vazio = mantém o .env que já está na VPS)
  #   ENV_FILE_RAIZ   -> conteúdo inteiro do .env da raiz, usado pelo docker compose (opcional)
  # A cada deploy o .env anterior vai para .env_backups/ na VPS (guarda os 10 últimos); se o healthcheck
  # falhar, volta o código E o .env anterior.
  # Lembrete: p/ HTTPS + cookie seguro, defina CADDY_DOMAIN no .env (senão COOKIE_SECURE=false), senão o login quebra.
  # ============================================================================
  deploy:
    name: Deploy VPS (manual)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan, docker-build]
    if: github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      # o conteúdo vai pelo stdin do ssh: não aparece em log nem em linha de comando
      - name: Enviar .env (ENV_FILE / ENV_FILE_RAIZ) para a VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          ENV_FILE_RAIZ: ${{ secrets.ENV_FILE_RAIZ }}
        run: |
          set -e
          if [ -z "$ENV_FILE" ] && [ -z "$ENV_FILE_RAIZ" ]; then
            echo "ENV_FILE não configurado: o .env da VPS fica como está."
            exit 0
          fi
          umask 077
          mkdir -p ~/.ssh
          cat <<<"$VPS_SSH_KEY" > ~/.ssh/deploy_key
          SSH="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new $VPS_USER@$VPS_HOST"
          if [ -n "$ENV_FILE" ]; then
            cat <<<"$ENV_FILE" | $SSH "umask 077; cat > '$VPS_APP_DIR/backend/.env.novo'"
            echo "backend/.env novo enviado."
          fi
          if [ -n "$ENV_FILE_RAIZ" ]; then
            cat <<<"$ENV_FILE_RAIZ" | $SSH "umask 077; cat > '$VPS_APP_DIR/.env.novo'"
            echo ".env da raiz novo enviado."
          fi
          rm -f ~/.ssh/deploy_key

      - name: Deploy via SSH com gate de healthcheck
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            PREV=$(git rev-parse HEAD)
            echo "Commit atual: $PREV"

            # troca o .env pelo que veio do GitHub, guardando o anterior
            STAMP=$(date +%Y%m%d_%H%M%S)
            mkdir -p .env_backups && chmod 700 .env_backups
            TROCOU=""
            for alvo in backend/.env .env; do
              if [ -f "$alvo.novo" ]; then
                nome=$(echo "$alvo" | tr '/' '_')
                [ -f "$alvo" ] && cp -p "$alvo" ".env_backups/${nome}.$STAMP"
                mv "$alvo.novo" "$alvo" && chmod 600 "$alvo"
                TROCOU="$TROCOU $alvo"
                echo "$alvo atualizado (anterior em .env_backups/${nome}.$STAMP)"
              fi
            done
            ls -1t .env_backups/* 2>/dev/null | tail -n +21 | xargs -r rm -f

            git fetch --all --prune
            git checkout "${{ github.ref_name }}"
            git pull --ff-only
            docker compose build backend frontend
            docker compose up -d

            echo "Aguardando healthcheck (/api/v1/healthz)..."
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/api/v1/healthz >/dev/null 2>&1; then ok=1; break; fi
              sleep 3
            done

            if [ "$ok" != "1" ]; then
              echo "❌ HEALTHCHECK FALHOU — rollback para $PREV"
              for alvo in $TROCOU; do
                nome=$(echo "$alvo" | tr '/' '_')
                [ -f ".env_backups/${nome}.$STAMP" ] && cp -p ".env_backups/${nome}.$STAMP" "$alvo" && echo "$alvo restaurado"
              done
              git reset --hard "$PREV"
              docker compose build backend frontend
              docker compose up -d
              exit 1
            fi
            echo "✅ Deploy saudável em $(git rev-parse HEAD)"
