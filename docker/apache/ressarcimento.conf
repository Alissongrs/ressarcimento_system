# Reverse-proxy do Apache (host) para o app Ressarcimento — HTTP, porta 80.
# Acesso oficial: http://179.127.26.37  e  http://sure.app.br  (sem TLS/cert).
# O Apache já é o front da 80/443 (email-api / monitoramento / ti); este vhost
# convive por name-based virtual hosting.
#
# Instalar na VPS:
#   sudo cp docker/apache/ressarcimento.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite ressarcimento.conf
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2      # NÃO derruba os outros sites
#
# Containers (docker-compose.yml):  frontend -> 127.0.0.1:8090 | backend -> 127.0.0.1:8080
#
# Obs: com ServerAlias do IP, requests com Host = sure.app.br OU 179.127.26.37 caem aqui.
# Se este virar o site default da :80 e você quiser manter o 'ti' como default,
# renomeie o arquivo para zz-ressarcimento.conf (carrega por último).

<VirtualHost *:80>
    ServerName sure.app.br
    ServerAlias 179.127.26.37

    ProxyPreserveHost On
    ProxyRequests Off
    # acesso é HTTP (sem TLS) — informa o esquema ao backend
    RequestHeader set X-Forwarded-Proto "http"
    # chat/RAG pode demorar (RAG_CHAT_TIMEOUT_SEC=300)
    ProxyTimeout 320

    # SSE (alertas em tempo real) ANTES de /api: entrega cada evento na hora (flushpackets)
    # e segura a conexão aberta por 1h — sem isso o Apache corta o stream
    # (net::ERR_INCOMPLETE_CHUNKED_ENCODING no console).
    ProxyPass        /api/v1/alertas/stream  http://127.0.0.1:8080/api/v1/alertas/stream  flushpackets=on timeout=3600
    ProxyPassReverse /api/v1/alertas/stream  http://127.0.0.1:8080/api/v1/alertas/stream

    # API primeiro (mais específico) -> backend
    ProxyPass        /api  http://127.0.0.1:8080/api  timeout=320
    ProxyPassReverse /api  http://127.0.0.1:8080/api

    # resto (SPA) -> frontend
    ProxyPass        /     http://127.0.0.1:8090/
    ProxyPassReverse /     http://127.0.0.1:8090/

    ErrorLog  ${APACHE_LOG_DIR}/ressarcimento_error.log
    CustomLog ${APACHE_LOG_DIR}/ressarcimento_access.log combined
</VirtualHost>
