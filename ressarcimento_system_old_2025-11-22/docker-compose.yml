version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: ressarcimento_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: "America/Sao_Paulo"
    command: [
      "--default-authentication-plugin=mysql_native_password",
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--default-time-zone=-03:00"
    ]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  ocr:
    build:
      context: ./ocr_service
      dockerfile: Dockerfile
    container_name: ressarcimento_ocr
    restart: unless-stopped
    environment:
      TZ: "America/Sao_Paulo"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ping > /dev/null 2>&1 || curl -sf http://127.0.0.1:8000/ping > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ressarcimento_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # CORS e fuso horário
      CORS_ALLOW_ORIGINS: "http://sure.app.br,http://sure.app.br:8080,https://sure.app.br,http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1"
      TZ: "America/Sao_Paulo"
      # OCR interno (FastAPI/Tesseract)
      OCR_BACKEND_URL: "http://ocr:8000"
      # Diretório de uploads
      UPLOAD_DIR: "/app/uploads"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - ocr
    volumes:
      # Persistência de anexos
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/healthz || curl -sf http://127.0.0.1:8080/api/v1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ressarcimento_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
    driver: local
