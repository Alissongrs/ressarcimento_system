server {
  listen 80;
  server_name _;

  # Limite de upload
  client_max_body_size 50M;

  # App estÃ¡tico (Vite build)
  root   /usr/share/nginx/html;
  index  index.html;

  # =========================
  # BACKEND (REST + SSE)
  # =========================
  location ^~ /api/ {
    proxy_pass         http://backend:8080;  # << sem /api/ aqui
    proxy_http_version 1.1;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # SSE / streaming
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Se quiser manter v1 separado, ok, mas nÃ£o precisa.
  # /api/v1/* jÃ¡ cai no bloco acima.

  # =========================
  # SWAGGER
  # =========================
  location ^~ /swagger/ {
    proxy_pass         http://backend:8080;
    proxy_http_version 1.1;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # =========================
  # UPLOADS (PDFs, anexos)
  # =========================
  location ^~ /uploads/ {
    proxy_pass         http://backend:8080;  # << sem /uploads/ aqui
    proxy_http_version 1.1;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Ajuda PDF no browser (range requests)
    proxy_set_header   Range $http_range;
    proxy_set_header   If-Range $http_if_range;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
