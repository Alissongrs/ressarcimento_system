server {
  listen 80;
  server_name _;

  # Limite de upload
  client_max_body_size 50M;

  server_tokens off;

  # =========================
  # SECURITY HEADERS
  # =========================
  add_header X-Frame-Options           "SAMEORIGIN"           always;
  add_header X-Content-Type-Options    "nosniff"              always;
  add_header X-XSS-Protection          "1; mode=block"        always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self';" always;
  add_header Cache-Control             "no-store, no-cache, must-revalidate" always;
  add_header Pragma                    "no-cache" always;

  # App estÃ¡tico (Vite build)
  root   /usr/share/nginx/html;
  index  index.html;

  # =========================
  # BACKEND (REST + SSE)
  # =========================
  location ^~ /api/ {
    proxy_pass         http://backend:8080;  # << sem /api/ aqui
    proxy_http_version 1.1;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # SSE / streaming
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

  }

  # Se quiser manter v1 separado, ok, mas nÃ£o precisa.
  # /api/v1/* jÃ¡ cai no bloco acima.

  # =========================
  # SWAGGER (restrito a localhost)
  # =========================
  location ^~ /swagger/ {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_pass         http://backend:8080;
    proxy_http_version 1.1;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # =========================
  # UPLOADS (PDFs, anexos)
  # =========================
  location ^~ /uploads/ {
    proxy_pass         http://backend:8080;  # << sem /uploads/ aqui
    proxy_http_version 1.1;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Ajuda PDF no browser (range requests)
    proxy_set_header   Range $http_range;
    proxy_set_header   If-Range $http_if_range;
  }

  # MIME type correto para módulos ES (.mjs) — necessário para pdfjs-dist worker
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
