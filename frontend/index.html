<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" type="image/png" href="/favorito-default.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>SURE - Sistema Unificado de Ressarcimento</title>
    <script>
      // Seed initial theme early to avoid flash of wrong theme
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var allowed = ['flowtory','flowtory-dark','light','dark','light-1','light-2','light-3','light-4','pink','pinklight'];
          var theme = (saved && allowed.indexOf(saved) >= 0)
            ? saved
            : 'flowtory';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'flowtory');
        }
      })();
    </script>
    <script>
      // Title marquee animation (moves left). Pauses when tab is hidden.
      (function() {
        var base = ' SURE - Sistema Unificado de Ressarcimento '; // leading space for smooth loop
        var gap = '   ';
        var text = base + gap;
        var i = 0;
        var timer = null;
        function tick(){
          if (document.hidden) return; // do not update while hidden
          document.title = text.slice(i) + text.slice(0, i);
          i = (i + 1) % text.length;
        }
        function start(){ if(!timer) timer = setInterval(tick, 200); }
        function stop(){ if(timer){ clearInterval(timer); timer = null; } }
        document.addEventListener('visibilitychange', function(){
          if (document.hidden) stop(); else start();
        });
        start();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx?v=theme-bust-3"></script>
  </body>
</html>
