# nginx interno do app do celular. Só serve os arquivos de /m/; os cabeçalhos de segurança
# (CSP etc.) e o /api/ ficam no nginx do frontend, que é quem recebe o acesso de fora.
server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  location = /m/sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/m/";
    try_files $uri =404;
  }
  location = /m/manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }
  location ^~ /m/assets/ {
    try_files $uri =404;
  }
  location /m/ {
    try_files $uri $uri/ /m/index.html;
  }
  location = /healthz {
    return 200 "ok";
  }
}
