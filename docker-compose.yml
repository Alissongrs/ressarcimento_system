name: ressarcimento_system

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: "America/Sao_Paulo"
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=-03:00"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  ocr:
    build:
      context: ./ocr_service
      dockerfile: Dockerfile
      args:
        INSTALL_OCR_EXTRAS: "1"
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      TZ: "America/Sao_Paulo"
      # LLM no OCR service:
      LLM_OLLAMA_URL: "http://ollama:11434"
      LLM_OLLAMA_MODEL: "llama3.2:3b"
      # (opcionais)
      OCR_PROMPT_NAME: "PROMPT_FATURA_ILTTO_V1"
      OCR_FEWSHOT_PATH: "/app/prompts/ilttio_fewshot.txt"
      OCR_LANG: "por"
      OCR_MAX_PAGES: "2"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping', timeout=2).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  llama-agent:
    build:
      context: ./backend/ia
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      TZ: "America/Sao_Paulo"
      OLLAMA_URL: "http://ollama:11434"
      LLAMA_MODEL: "mistral"
      LLAMA_TIMEOUT: "120"
      PORT: "8000"
      HOST: "0.0.0.0"
      DEBUG: "false"
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping', timeout=2).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ressarcimento-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      CORS_ALLOW_ORIGINS: "http://sure.app.br,http://sure.app.br:8080,https://sure.app.br,http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1"
      TZ: "America/Sao_Paulo"

      # Ollama (container)
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_CHAT_MODEL: "llama3.2:3b"
      RAG_EMBED_MAX_CHARS: "1500"
      RAG_TEXT_CHUNK_CHARS: "1500"
      RAG_CHAT_TIMEOUT_SEC: "300"

      # Llama Agent para resumos (container interno)
      LLAMA_AGENT_URL: "http://llama-agent:8000"

      # OCR interno (FastAPI/Tesseract)
      OCR_BACKEND_URL: "http://ocr:8000"
      DESVIO_MEDIA_FORCE_PROXY: "1"

      AUDITTA_RAG_INDEX: "/app/data/catalogo.txt"
      UPLOAD_DIR: "/app/uploads"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_healthy
      llama-agent:
        condition: service_healthy
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/uploads
      - ./backend/data/catalogo.txt:/app/data/catalogo.txt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
    driver: local
  ollama_data:
    driver: local
  uploads_data:
    driver: local
