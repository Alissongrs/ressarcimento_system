  #     LLAMA_TIMEOUT: "120"
  #     PORT: "8000"
  #     HOST: "0.0.0.0"
  #     DEBUG: "false"
  #   ports:
  #     - "127.0.0.1:8001:8000"
  #   networks:
  #     - backend
  #     - ai

  backend:
    image: ressarcimento-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      CORS_ALLOW_ORIGINS: "http://sure.app.br,http://sure.app.br:8080,https://sure.app.br,http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1"
      COOKIE_SECURE: "false"
      LOG_FORMAT: "json"
      TZ: "America/Sao_Paulo"

      # Ollama (container)
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_CHAT_MODEL: "llama3.2:3b"
      RAG_EMBED_MAX_CHARS: "1500"
      RAG_TEXT_CHUNK_CHARS: "1500"
      RAG_CHAT_TIMEOUT_SEC: "300"

      # Llama Agent para resumos (container interno)
      LLAMA_AGENT_URL: "http://llama-agent:8000"

      # OCR interno (FastAPI/Tesseract)
      OCR_BACKEND_URL: "http://ocr:8000"
      DESVIO_MEDIA_FORCE_PROXY: "1"

      AUDITTA_RAG_INDEX: "/app/data/catalogo.txt"
      UPLOAD_DIR: "/app/uploads"

      # Redis (rate limiting distribuído)
      REDIS_URL: "redis://redis:6379"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ocr / llama-agent / ollama desativados em 29/05/2026 — ver bloco acima
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/uploads
      - ./backend/data/catalogo.txt:/app/data/catalogo.txt
      - ./backend/data/regras_aisure.txt:/app/data/regras_aisure.txt:ro
      - ./backend/data/prompt_confirmar.txt:/app/data/prompt_confirmar.txt:ro
      - ./backend/data/prompt_tese.txt:/app/data/prompt_tese.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Porta 80 exposta apenas internamente — acesso externo via Caddy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - frontend

  # TLS terminator — expõe HTTP(:80) e HTTPS(:443) para o mundo externo
  # Em prod: defina CADDY_DOMAIN no .env (ex: sure.app.br) para cert Let's Encrypt automático
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - frontend

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  # ollama_data desativado em 29/05/2026 junto com serviço ollama

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  # rede 'ai' desativada em 29/05/2026 — só servia ocr/llama-agent/ollama
