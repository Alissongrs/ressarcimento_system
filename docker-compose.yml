name: ressarcimento_system

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-r00t_S3cure!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appdb}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-App_S3cur3!}
      TZ: "America/Sao_Paulo"
    command:
      - "--default-authentication-plugin=caching_sha2_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=-03:00"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  # ====================================================================
  # Serviços ollama / ocr / llama-agent DESATIVADOS em 29/05/2026.
  # Motivo: pastas ./ia e ./ocr_service saíram do repo git
  # (mantidas só localmente). Pipeline LLM agora usa Haiku (Anthropic)
  # direto do backend. OCR via Tesseract embedded ou serviço externo.
  # ====================================================================
  # ollama:
  #   image: ollama/ollama:0.6.2
  #   restart: unless-stopped
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 20
  #     start_period: 20s
  #   networks:
  #     - ai
  #
  # ocr:
  #   build:
  #     context: ./ocr_service
  #     dockerfile: Dockerfile
  #     args:
  #       INSTALL_OCR_EXTRAS: "1"
  #   restart: unless-stopped
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #   environment:
  #     TZ: "America/Sao_Paulo"
  #     LLM_OLLAMA_URL: "http://ollama:11434"
  #     LLM_OLLAMA_MODEL: "llama3.2:3b"
  #     OCR_PROMPT_NAME: "PROMPT_FATURA_ILTTO_V1"
  #     OCR_FEWSHOT_PATH: "/app/prompts/ilttio_fewshot.txt"
  #     OCR_LANG: "por"
  #     OCR_MAX_PAGES: "2"
  #   networks:
  #     - backend
  #     - ai
  #
  # llama-agent:
  #   build:
  #     context: ./ia
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #   env_file:
  #     - ./backend/.env
  #   environment:
  #     TZ: "America/Sao_Paulo"
  #     OLLAMA_URL: "http://ollama:11434"
  #     LLAMA_MODEL: "mistral"
  #     LLAMA_TIMEOUT: "120"
  #     PORT: "8000"
  #     HOST: "0.0.0.0"
  #     DEBUG: "false"
  #   ports:
  #     - "127.0.0.1:8001:8000"
  #   networks:
  #     - backend
  #     - ai

  backend:
    image: ressarcimento-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # P0-3: ativa os guardrails de produção (JWT_SECRET obrigatório/forte em auth/jwt.go)
      GO_ENV: "${GO_ENV:-production}"
      # P0-1: TLS na conexão com o RDS. Default "skip-verify" = tráfego CRIPTOGRAFADO (TLSv1.3),
      # sem validar a cadeia do certificado. Fecha o crítico de dados em texto puro na internet.
      # Testado: o RDS apresenta cert legítimo Amazon RDS us-east-2; a validação plena falha no
      # OpenSSL do Python por rigidez de cadeia. Para LIGAR o verify completo (recomendado), rode
      # da VPS um ping com DB_APP_TLS=rds (bundle em backend/certs/global-bundle.pem já é copiado
      # no Dockerfile) e, confirmando, troque para "rds".
      DB_APP_TLS: "${DB_APP_TLS:-skip-verify}"
      # CORS: prioriza HTTPS. Origens http de localhost mantidas só p/ dev.
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-https://sure.app.br,http://localhost,http://localhost:5173,http://127.0.0.1}"
      # P0-6: cookie Secure por padrão (exige HTTPS/Caddy TLS ativo). Em dev HTTP puro, defina COOKIE_SECURE=false.
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      LOG_FORMAT: "json"
      TZ: "America/Sao_Paulo"

      # Ollama (container)
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_CHAT_MODEL: "llama3.2:3b"
      RAG_EMBED_MAX_CHARS: "1500"
      RAG_TEXT_CHUNK_CHARS: "1500"
      RAG_CHAT_TIMEOUT_SEC: "300"

      # Llama Agent para resumos (container interno)
      LLAMA_AGENT_URL: "http://llama-agent:8000"

      # OCR interno (FastAPI/Tesseract)
      OCR_BACKEND_URL: "http://ocr:8000"
      DESVIO_MEDIA_FORCE_PROXY: "1"

      AUDITTA_RAG_INDEX: "/app/data/catalogo.txt"
      UPLOAD_DIR: "/app/uploads"
      # WhatsApp da empresa conectado por QR code (sessão no volume whatsapp_data)
      WHATSAPP_DIR: "/app/whatsapp_sessao"

      # Redis (rate limiting distribuído)
      REDIS_URL: "redis://redis:6379"
    ports:
      # P0-6: expõe só no loopback do host (scripts locais em localhost:8080 seguem funcionando;
      # acesso externo é bloqueado — o tráfego real chega via rede docker frontend/nginx/Caddy).
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ocr / llama-agent / ollama desativados em 29/05/2026 — ver bloco acima
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/app/uploads
      - whatsapp_data:/app/whatsapp_sessao
      - ./backend/data/catalogo.txt:/app/data/catalogo.txt
      - ./backend/data/regras_aisure.txt:/app/data/regras_aisure.txt:ro
      - ./backend/data/prompt_confirmar.txt:/app/data/prompt_confirmar.txt:ro
      - ./backend/data/prompt_tese.txt:/app/data/prompt_tese.txt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Publicado no LOOPBACK do host (127.0.0.1:8090) p/ o Apache do host fazer reverse-proxy.
    # (Neste VPS o Apache é o front de vários sites *.amee.com.br; o Caddy fica desativado.)
    ports:
      - "127.0.0.1:8090:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - frontend

  # ====================================================================
  # CADDY DESATIVADO neste VPS (30/07/2026).
  # O front público aqui é o APACHE DO HOST, que já termina TLS p/ vários
  # sites (email-api / monitoramento / ti .amee.com.br) e não pode ceder a
  # 80/443. O Apache faz reverse-proxy do domínio do ressarcimento p/ os
  # containers: /  -> frontend (127.0.0.1:8090)  |  /api -> backend (127.0.0.1:8080).
  # Ver docker/apache/ressarcimento-ssl.conf. Para voltar a usar Caddy (outro
  # ambiente sem Apache na frente), descomente este bloco.
  # ====================================================================
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   environment:
  #     CADDY_DOMAIN: "${CADDY_DOMAIN:-}"
  #     CADDY_EMAIL: "${CADDY_EMAIL:-}"
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     frontend:
  #       condition: service_healthy
  #   networks:
  #     - frontend

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
  whatsapp_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  # ollama_data desativado em 29/05/2026 junto com serviço ollama

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  # rede 'ai' desativada em 29/05/2026 — só servia ocr/llama-agent/ollama
